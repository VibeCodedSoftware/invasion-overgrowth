plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.1.0'
group = 'com.invasion'
base { archivesName = 'invasion-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.266'
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'invasion.selftest', project.findProperty('selftest') ?: 'false'
            systemProperty 'invasion.selftest.mode', project.findProperty('selftestMode') ?: 'world'
            systemProperty 'invasion.selftest.case', project.findProperty('selftestCase') ?: ''
        }
    }
    mods {
        invasion { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
