displayName = "Invasion: Overgrowth"
enumExtensions = "META-INF/enumextensions.json"
authors = "VibeCodedSoftware"
description = '''
After three days a blood-red meteor tears across the sky and opens a portal. A never-ending horde of
sword-swinging, tunnelling invaders pours out and hunts you down wherever you are. Cross into the Overgrowth -
mossy wilds, giant tree lands with Ent villages, the Flesh, Dark Flesh, Blood Grove and Bloodstone Wastes -
climb to the temple and defeat its Guardian to claim the Particle Gauntlet and end the invasion.

A spiritual successor to Hostile Worlds: Invasion by Corosus.
'''

